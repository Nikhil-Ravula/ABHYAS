{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Important Questions - ABHYAS</title>
    <link rel="icon" href="{{ FAVICON_URL }}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=5">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    {% if UMAMI_SRC and UMAMI_WEBSITE_ID %}
    <script defer src="{{ UMAMI_SRC }}/script.js" data-website-id="{{ UMAMI_WEBSITE_ID }}"
        data-auto-track="true"></script>
    {% endif %}
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>

<body>

    <nav class="navbar">
        <div class="container">
            <a href="{% url 'index' %}" class="nav-brand" data-umami-event="nav.abhyas">
                <div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
                <span>ABHYAS</span>
            </a>
            <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme">
                <i class="fas fa-moon"></i>
            </button>
            <div class="hamburger"
                onclick="this.classList.toggle('active'); document.getElementById('navLinks').classList.toggle('active');">
                <span></span><span></span><span></span>
            </div>
            <ul class="nav-links" id="navLinks">
                <li><a href="{% url 'links' %}" data-umami-event="nav.links"><i class="fas fa-link"></i> Links</a></li>
                <li><a href="{% url 'logout' %}" style="color: var(--danger);" data-umami-event="nav.logout"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="page-wrapper">
        <div class="container dashboard">
            <div class="dashboard-header animate-up">
                <div>
                    <h1><i class="fas fa-star" style="color:var(--secondary)"></i> Important Questions</h1>
                    <p class="welcome-text">Hello, <strong>{{ user.username }}</strong>! Search for important questions below.</p>
                </div>
            </div>

            <div class="search-section animate-up-delay">
                <div class="search-bar">
                    <input type="text" class="form-control" id="searchIq" placeholder="🔍 Search by subject"
                        oninput="searchIq()" data-umami-event="search.iq">
                    <button class="btn btn-primary" onclick="searchIq()" data-umami-event="search.iq.submit"><i
                            class="fas fa-search"></i>
                        Search</button>
                </div>

                <div class="filter-panel">
                    <div class="filter-group">
                        <label><i class="fas fa-layer-group"></i> Unit</label>
                        <select id="filterIqUnit" onchange="searchIq()" data-umami-event="filter.iq.unit">
                            <option value="">All Units</option>
                            <option value="1">Unit 1</option>
                            <option value="2">Unit 2</option>
                            <option value="3">Unit 3</option>
                            <option value="4">Unit 4</option>
                            <option value="5">Unit 5</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label><i class="fas fa-tag"></i> Type</label>
                        <select id="filterIqType" onchange="searchIq()" data-umami-event="filter.iq.type">
                            <option value="">All Types</option>
                            <option value="short">Short Answer</option>
                            <option value="long">Long Answer</option>
                        </select>
                    </div>
                    <div class="filter-group" style="flex:0;">
                        <label>&nbsp;</label>
                        <button class="btn btn-secondary btn-sm" onclick="resetIqFilters()"
                            data-umami-event="filter.iq.reset"><i class="fas fa-undo"></i> Reset</button>
                    </div>
                </div>
            </div>
            <div id="iqResultsArea" class="animate-up-delay-2">
                <!-- Grouped rendering -->
            </div>

        </div>
    </div>

    <script>
        // ── Back Button Lock ────────────────────────────────────────────────
        history.pushState(null, '', window.location.href);
        window.addEventListener('popstate', function () {
            history.pushState(null, '', window.location.href);
        });

        async function searchIq() {
            const search = document.getElementById('searchIq').value.trim();
            const unit = document.getElementById('filterIqUnit').value;
            const type = document.getElementById('filterIqType').value;
            const resultsArea = document.getElementById('iqResultsArea');

            if (!search) {
                resultsArea.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><h3>Search for Important Questions</h3><p>Enter a subject or hashtag to view questions.</p></div>`;
                return;
            }

            resultsArea.innerHTML = '<div class="spinner"></div>';

            try {
                const params = new URLSearchParams({ search, unit, type });
                const response = await fetch('?' + params.toString(), {
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                });
                const iqs = await response.json();

                if (iqs.length === 0) {
                    resultsArea.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><h3>No Important Questions Found</h3><p>Try different filters.</p></div>`;
                    return;
                }

                let html = '';
                let currentGroup = '';

                iqs.forEach(q => {
                    const groupKey = `${q.subject} Unit ${q.unit} - ${q.type === 'short' ? 'Short' : 'Long'} `;
                    if (groupKey !== currentGroup) {
                        if (currentGroup !== '') html += '</div></div>'; // close previous card-body and card

                        const dlParams = new URLSearchParams({ search: q.subject, unit: q.unit, type: q.type });
                        const dlUrl = '{% url "download_iq_pdf" %}?' + dlParams.toString();

                        html += `
                <div class="card" style="margin-top: 20px;">
                    <div class="card-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                        <h3 class="card-title" style="margin: 0; color: var(--secondary); font-size: 1.1rem;"><i class="fas fa-layer-group"></i> ${groupKey}</h3>
                        <a href="${dlUrl}" class="btn btn-primary btn-sm" data-umami-event="iq.download_pdf"><i class="fas fa-file-pdf"></i> Download PDF</a>
                    </div>
                    <div class="card-body" style="padding: 0;">`;
                        currentGroup = groupKey;
                    }

                    html += `
                <div style="padding: 15px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 5px;">
                    <div style="color: var(--text-secondary); font-size: 1rem; display: flex; align-items: flex-start;">
                        <span style="font-weight: bold; color: var(--accent); margin-right: 8px; white-space: nowrap;">Q${q.number}:</span>
                        <span style="flex: 1; margin-top: 1px;">${q.text ? escapeHtml(q.text) : (q.is_image ? '' : '<span style="color:var(--text-muted);">(See attached file)</span>')}</span>
                    </div>
                    
                    ${q.file_url ? (q.is_image ? `
                    <div style="margin-top: 10px; margin-left: 32px; text-align: left;">
                        <img src="${q.file_url}" alt="Question Image" style="max-width: 100%; max-height: 400px; border-radius: 6px; border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                    </div>` : `
                    <div style="margin-top: 8px; margin-left: 32px;">
                        <a href="${q.file_url}" target="_blank" class="btn btn-outline btn-sm" style="font-size: 0.75rem; padding: 4px 10px;" data-umami-event="iq.view"><i class="fas fa-eye"></i> View</a>
                        <a href="${q.file_url}" download class="btn btn-outline btn-sm" style="font-size: 0.75rem; padding: 4px 10px; margin-left: 5px;" data-umami-event="iq.download_file"><i class="fas fa-download"></i> Download</a>
                    </div>`) : ''}
                </div>`;
                });
                if (currentGroup !== '') html += '</div></div>'; // close last card-body and card

                resultsArea.innerHTML = html;
            } catch (e) {
                resultsArea.innerHTML = `<div class="empty-state"><h3>Error Loading Questions</h3></div>`;
            }
        }

        function resetIqFilters() {
            document.getElementById('searchIq').value = '';
            document.getElementById('filterIqUnit').value = '';
            document.getElementById('filterIqType').value = '';
            searchIq();
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
    <script src="{% static 'js/theme.js' %}"></script>

</body>

</html>
