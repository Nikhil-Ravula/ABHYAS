{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - ABHYAS</title>
    <link rel="icon" href="{{ FAVICON_URL }}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=5">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    {% if UMAMI_SRC and UMAMI_WEBSITE_ID %}
    <script defer src="{{ UMAMI_SRC }}/script.js" data-website-id="{{ UMAMI_WEBSITE_ID }}"
        data-auto-track="true"></script>
    {% endif %}
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>

<body>

    <nav class="navbar">
        <div class="container">
            <a href="{% url 'index' %}" class="nav-brand" data-umami-event="nav.abhyas">
                <div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
                <span>ABHYAS</span>
            </a>
            <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme">
                <i class="fas fa-moon"></i>
            </button>
            <div class="hamburger"
                onclick="this.classList.toggle('active'); document.getElementById('navLinks').classList.toggle('active');">
                <span></span><span></span><span></span>
            </div>
            <ul class="nav-links" id="navLinks">
                <li><a href="{% url 'links' %}" data-umami-event="nav.links"><i class="fas fa-link"></i> Links</a></li>
                <li><a href="{% url 'logout' %}" style="color: var(--danger);" data-umami-event="nav.logout"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="page-wrapper">
        <div class="container dashboard">

            {% if announcements %}
            <!-- ── Announcements Box ─────────────────────────────── --
            <style>
                @keyframes ann-glow {

                    0%,
                    100% {
                        box-shadow: 0 0 12px rgba(108, 99, 255, 0.35), 0 0 0 1px rgba(108, 99, 255, 0.25);
                        border-color: rgba(108, 99, 255, 0.5);
                    }

                    50% {
                        box-shadow: 0 0 22px rgba(0, 196, 140, 0.4), 0 0 0 1px rgba(0, 196, 140, 0.3);
                        border-color: rgba(0, 196, 140, 0.55);
                    }
                }

                .ann-box {
                    background: linear-gradient(135deg, var(--bg-ann-gradient-start) 0%, var(--bg-ann-gradient-end) 100%);
                    backdrop-filter: blur(20px);
                    border: 1.5px solid rgba(108, 99, 255, 0.55);
                    border-radius: var(--radius);
                    padding: 0;
                    margin-bottom: 28px;
                    animation: ann-glow 3.5s ease-in-out infinite;
                    overflow: hidden;
                    opacity: 1;
                }

                .ann-box-header {
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    padding: 14px 20px;
                    background: rgba(79, 70, 229, 0.04);
                    border-bottom: 1px solid var(--border);
                    gap: 12px;
                }

                .ann-box-title {
                    display: flex;
                    align-items: center;
                    gap: 10px;
                    font-family: var(--font-heading);
                    font-size: 0.95rem;
                    font-weight: 700;
                    letter-spacing: 0.04em;
                    color: var(--primary-light);
                }

                .ann-box-title i {
                    font-size: 1rem;
                    color: var(--secondary);
                }

                .ann-view-btn {
                    background: transparent;
                    border: 1px solid rgba(108, 99, 255, 0.3);
                    color: var(--primary-light);
                    padding: 5px 14px;
                    border-radius: 50px;
                    font-size: 0.78rem;
                    font-family: var(--font-main);
                    cursor: pointer;
                    transition: var(--transition);
                    white-space: nowrap;
                }

                .ann-view-btn:hover {
                    background: rgba(108, 99, 255, 0.15);
                    border-color: var(--primary-light);
                }

                .ann-item {
                    display: flex;
                    align-items: flex-start;
                    gap: 12px;
                    padding: 12px 20px;
                    border-bottom: 1px solid var(--border);
                    transition: background 0.2s;
                }

                .ann-item:last-child {
                    border-bottom: none;
                }

                .ann-item:hover {
                    background: rgba(108, 99, 255, 0.06);
                }

                .ann-bullet {
                    width: 8px;
                    height: 8px;
                    border-radius: 50%;
                    background: linear-gradient(135deg, var(--primary), var(--secondary));
                    margin-top: 6px;
                    flex-shrink: 0;
                    box-shadow: 0 0 6px rgba(108, 99, 255, 0.5);
                }

                .ann-text {
                    flex: 1;
                    font-size: 0.9rem;
                    color: var(--text-secondary);
                    line-height: 1.6;
                }

                .ann-date {
                    font-size: 0.75rem;
                    color: var(--text-muted);
                    white-space: nowrap;
                    margin-top: 2px;
                }

                .ann-hidden {
                    display: none;
                }
            </style>

            <div class="ann-box">
                <div class="ann-box-header">
                    <div class="ann-box-title">
                        <i class="fas fa-bullhorn"></i>
                        📢 ANNOUNCEMENTS
                    </div>
                    {% if announcements.count > 3 %}
                    <button class="ann-view-btn" id="ann-toggle-btn" onclick="toggleAnnouncements()" data-umami-event="announcements.toggle">
                        View All <i class="fas fa-chevron-down" style="font-size:0.7rem;"></i>
                    </button>
                    {% endif %}
                </div>

                {% for ann in announcements %}
                <div class="ann-item {% if forloop.counter > 3 %}ann-hidden ann-extra{% endif %}">
                    <div class="ann-bullet"></div>
                    <div style="flex:1;">
                        <div class="ann-text">{{ ann.message }}</div>
                        <div class="ann-date"><i class="fas fa-clock" style="margin-right:4px;"></i>{{ ann.created_at|date:"d M, Y" }}</div>
                    </div>
                </div>
                {% endfor %}
            </div>

            <script>
                var annExpanded = false;
                function toggleAnnouncements() {
                    annExpanded = !annExpanded;
                    document.querySelectorAll('.ann-extra').forEach(function (el) {
                        el.classList.toggle('ann-hidden', !annExpanded);
                    });
                    var btn = document.getElementById('ann-toggle-btn');
                    if (btn) {
                        btn.innerHTML = annExpanded
                            ? 'Show Less <i class="fas fa-chevron-up" style="font-size:0.7rem;"></i>'
                            : 'View All <i class="fas fa-chevron-down" style="font-size:0.7rem;"></i>';
                    }
                }
            </script>
            {% endif %} -->


            <div class="search-section animate-up-delay">
                <div class="search-bar">
                    <input type="text" class="form-control" id="searchHashtag" placeholder="🔍 Search by subject"
                        oninput="searchPapers()" data-umami-event="search.pyq">
                    <button class="btn btn-primary" onclick="searchPapers()" data-umami-event="search.pyq.submit"><i
                            class="fas fa-search"></i>
                        Search</button>
                </div>

                <div class="filter-panel">
                    <div class="filter-group">
                        <label><i class="fas fa-calendar"></i> Year</label>
                        <select id="filterYear" onchange="searchPapers()" data-umami-event="filter.year">
                            <option value="">All Years</option>
                            {% for year in years %}
                            <option value="{{ year }}">{{ year }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="filter-group">
                        <label><i class="fas fa-code-branch"></i> Branch</label>
                        <select id="filterBranch" onchange="searchPapers()" data-umami-event="filter.branch">
                            <option value="">All Branches</option>
                            <option value="CSE">CSE</option>
                            <option value="ECE">ECE</option>
                            <option value="IT">IT</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label><i class="fas fa-book"></i> Regulation</label>
                        <select id="filterRegulation" onchange="searchPapers()"
                            data-umami-event="filter.regulation">
                            <option value="">All Regulations</option>
                            <option value="R02">R02</option>
                            <option value="R05">R05</option>
                            <option value="R07">R07</option>
                            <option value="R09">R09</option>
                            <option value="R13">R13</option>
                            <option value="R15">R15</option>
                            <option value="R16">R16</option>
                            <option value="R18">R18</option>
                            <option value="R22">R22</option>
                            <option value="R25">R25</option>
                        </select>
                    </div>
                    <div class="filter-group" style="flex:0;">
                        <label>&nbsp;</label>
                        <button class="btn btn-secondary btn-sm" onclick="resetFilters()"
                            data-umami-event="filter.pyq.reset"><i class="fas fa-undo"></i> Reset</button>
                    </div>
                </div>
            </div>

            <div id="resultsArea" class="animate-up-delay-2">
                <div class="empty-state" id="initialState">
                    <div class="empty-icon">🔍</div>
                    <h3>Search for Question Papers</h3>
                    <p>Enter a subject name or use filters to find papers.</p>
                </div>
            </div>

        </div>
    </div>

    <!-- ── PDF Viewer Modal ─────────────────────────────────────────────────── -->
    <div id="pdfViewerModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; 
        background:rgba(0,0,0,0.85); z-index:9999; justify-content:center; align-items:center;">
        <div
            style="position:relative; width:95%; height:95%; max-width:1000px; background:var(--bg-card); border-radius:var(--radius-lg); overflow:hidden; box-shadow: 0 0 40px rgba(0,0,0,0.5);">
            <div
                style="display:flex; justify-content:space-between; align-items:center; padding:0.75rem 1rem; background:var(--bg-card-hover); border-bottom:1px solid var(--border);">
                <span id="pdfViewerTitle" style="font-weight:600; font-size:0.95rem;"><i class="fas fa-file-pdf"
                        style="color:var(--danger);"></i> Viewing Paper</span>
                <button onclick="closeViewer()"
                    style="background:none; border:none; color:var(--text-primary); font-size:1.5rem; cursor:pointer; padding:0 0.5rem;"
                    title="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <iframe id="pdfViewerFrame" src="" style="width:100%; height:calc(100% - 50px); border:none;"></iframe>
        </div>
    </div>

    <script>
        // ── Back Button Lock ────────────────────────────────────────────────
        // Push dashboard into history so pressing Back keeps the user here.
        history.pushState(null, '', window.location.href);
        window.addEventListener('popstate', function () {
            history.pushState(null, '', window.location.href);
        });

        // ── PDF Viewer Modal ────────────────────────────────────────────────
        function viewPaper(paperId, paperTitle) {
            const modal = document.getElementById('pdfViewerModal');
            const frame = document.getElementById('pdfViewerFrame');
            const title = document.getElementById('pdfViewerTitle');
            title.innerHTML = '<i class="fas fa-file-pdf" style="color:var(--danger);"></i> ' + paperTitle;
            let viewUrl = '{% url "view_paper" 0 %}'.replace('0', paperId);
            frame.src = viewUrl;
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden'; // Prevent background scroll
        }

        function closeViewer() {
            const modal = document.getElementById('pdfViewerModal');
            const frame = document.getElementById('pdfViewerFrame');
            frame.src = ''; // Stop loading
            modal.style.display = 'none';
            document.body.style.overflow = ''; // Restore scroll
        }

        // Close modal on Escape key
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeViewer();
        });

        // Close modal on clicking outside the viewer
        document.getElementById('pdfViewerModal').addEventListener('click', function (e) {
            if (e.target === this) closeViewer();
        });


        async function searchPapers() {
            const hashtag = document.getElementById('searchHashtag').value.trim();
            const year = document.getElementById('filterYear').value;
            const branch = document.getElementById('filterBranch').value;
            const regulation = document.getElementById('filterRegulation').value;
            const resultsArea = document.getElementById('resultsArea');

            resultsArea.innerHTML = '<div class="spinner"></div>';

            try {
                const params = new URLSearchParams({ hashtag, year, branch, regulation });
                const response = await fetch('?' + params.toString(), {
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                });
                const papers = await response.json();

                if (papers.length === 0) {
                    resultsArea.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><h3>No Papers Found</h3><p>Try different filters.</p></div>`;
                    return;
                }

                let html = '<div class="papers-grid">';
                papers.forEach(p => {
                    html += `
                <div class="paper-card card">
                    <div class="paper-meta">
                        <span class="paper-badge badge-year">${p.year}</span>
                        <span class="paper-badge badge-type">${p.type}</span>
                        <span class="paper-badge badge-branch">${escapeHtml(p.branch)}</span>
                    </div>
                    <h3>${escapeHtml(p.subject)}</h3>
                    <div class="paper-info">
                        <span><i class="fas fa-user"></i>SITE OWNER</span>
                        <span><i class="fas fa-calendar-alt"></i> ${p.date}</span>
                    </div>
                    <div class="paper-actions">
                        <button onclick="viewPaper(${p.id}, '${escapeHtml(p.subject).replace(/'/g, "\\'")} (${p.year})')" class="btn btn-primary btn-sm" data-umami-event="paper.view"><i class="fas fa-eye"></i> View</button>
                        <a href="${'{% url "download_paper" 0 %}'.replace('0', p.id)}" class="btn btn-success btn-sm" data-umami-event="paper.download"><i class="fas fa-download"></i> Download</a>
                    </div>
                </div>`;
                });
                html += '</div>';
                resultsArea.innerHTML = html;
            } catch (e) {
                resultsArea.innerHTML = `<div class="empty-state"><h3>Error Loading Papers</h3></div>`;
            }
        }

        function resetFilters() {
            document.getElementById('searchHashtag').value = '';
            document.getElementById('filterYear').value = '';
            document.getElementById('filterBranch').value = '';
            document.getElementById('filterRegulation').value = '';
            searchPapers();
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', function () {
            searchPapers();
        });
    </script>
    <script src="{% static 'js/theme.js' %}"></script>
</body>

</html>
