name: Abhyas CI/CD

permissions:
  contents: read

on:
  push:
    branches: [development-v1, deployment-v1, main, krishna]
    paths-ignore:
      - 'AGENTS.md'
      - 'docs/**'
      - '*.md'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Django safety checks
        env:
          ENVIRONMENT: local
          SECRET_KEY: ci-validation-only
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver,vitharn.com
        run: |
          python -m venv /tmp/abhyas-ci-venv
          /tmp/abhyas-ci-venv/bin/pip install -r requirements-local.txt
          /tmp/abhyas-ci-venv/bin/python manage.py check
          /tmp/abhyas-ci-venv/bin/python manage.py makemigrations --check --dry-run
          /tmp/abhyas-ci-venv/bin/python manage.py test pyqapp --verbosity 1
